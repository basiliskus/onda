name: release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify tag matches versionName
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "Could not parse versionName from app/build.gradle.kts"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > onda-release.keystore
      - name: Build
        env:
          ONDA_KEYSTORE: ${{ github.workspace }}/onda-release.keystore
          ONDA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ONDA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :core:test :app:assembleRelease
      - run: rm -f onda-release.keystore
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
